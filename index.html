<!DOCTYPE html>
<html lang="hr" translate="no">

<head>
    <meta charset="UTF-8">

    <meta name="google" content="notranslate">

    <title>Happy Place</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="jezici">
        <button onclick="promijeniJezik('hr')">HR</button>
        <button onclick="promijeniJezik('en')">EN</button>
        <button onclick="promijeniJezik('de')">DE</button>
    </div>

    <div class="naslovna" id="pocetna">

        <!-- GORNJI IZBORNIK -->
        <nav class="izbornik">

            <div class="logo">
               <img src="Slike/logo.jpg"
     alt="Happy Place logo"
     translate="no">
            </div>

            <div class="izbornik-linkovi">
                <a href="#pocetna" data-i18n="menu_pocetna">Početna</a>
                <a href="o-kuci.html" data-i18n="menu_o_kuci">O kući</a>
                <a href="lokacija.html" data-i18n="menu_lokacija">Lokacija</a>
                <a href="#galerija" data-i18n="menu_galerija">Galerija</a>
                <a href="zamjena.html" data-i18n="menu_zamjena">Zamjena</a>
                <a href="kontakt.html" data-i18n="menu_kontakt">Kontakt</a>
            </div>

        </nav>


        <!-- GLAVNA SLIKA -->
        <img src="Slike/kuca.jpg" alt="Kuća Happy Place">


        <!-- ZATAMNJENJE SLIKE -->
        <div class="zatamnjenje"></div>


        <!-- NASLOV NA SLICI -->
        <div class="naslovni-tekst">
            <h1 translate="no">Happy Place</h1>

            <p data-i18n="pocetna_slogan">
                Moj mali dio svemira
            </p>
        </div>


        <!-- BRZI PODACI -->
        <div class="brzi-podaci">

            <div class="podatak">
                <span data-i18n="podatak_lokacija">Lokacija</span>

                <strong>Špišić Bukovica</strong>

                <p data-i18n="podatak_udaljenost">
                    8 km od centra Virovitice
                </p>
            </div>

            <div class="podatak">
                <span data-i18n="podatak_cijena">Cijena</span>

                <strong>250.000 €</strong>

                <p data-i18n="podatak_vlasnik">
                    Prodaje agencija bez naknade za kupca
                </p>
            </div>

            <div class="podatak">
                <span data-i18n="podatak_zamjena">
                    Moguća zamjena
                </span>

                <strong data-i18n="podatak_stanovi">
                    Noviji manji stan
                </strong>

                <p data-i18n="podatak_koprivnica">
                    uz nadoplatu
                </p>
            </div>

        </div>

    </div>


       <!-- JEZIČNI JAVASCRIPT -->
    <script src="language.js"></script>

 <!-- BROJAČ POSJETA -->
<div class="brojac-posjeta">
    <span class="brojac-ikona">👁</span>
    <span data-i18n="brojac_posjete">Posjete:</span>
    <strong id="broj-posjeta">...</strong>
</div>


<!-- GOATCOUNTER -->
<script>
    window.goatcounter = {
        no_onload: true
    };

    function ucitajBrojPosjeta() {

        fetch('https://happyplace.goatcounter.com/counter/TOTAL.json?t=' + Date.now())

            .then(response => response.json())

            .then(data => {

                document.getElementById('broj-posjeta').textContent = data.count;

            })

            .catch(() => {

                document.getElementById('broj-posjeta').textContent = '';

            });
    }
</script>


<script
    data-goatcounter="https://happyplace.goatcounter.com/count"
    async
    src="//gc.zgo.at/count.js"

    onload="
        window.goatcounter.count();

        setTimeout(ucitajBrojPosjeta, 1500);
    ">
</script>

</body>
</html>
