<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Virtualna šetnja – Happy Place</title>

    <link rel="stylesheet" href="setnja.css">
</head>

<body>
    <main class="setnja">
        <img id="fotografija" src="Setnja/1-prilaz.jpg" alt="Prilaz objektu">
        <div class="setnja-zatamnjenje"></div>

        <a class="setnja-povratak" href="index.html#virtualna-setnja">← <span id="tekst-povratak">Povratak</span></a>

        <header class="setnja-status">
            <span id="vrsta-setnje">Vanjska šetnja</span>
            <strong id="oznaka-prizora">Prilaz objektu</strong>
            <small id="napredak-prizora">Prizor 1 od 10</small>
        </header>

        <button class="setnja-izbornik-gumb" id="izbornik-gumb" type="button" aria-expanded="false" aria-controls="izbornik-lokacija">☰ <span id="tekst-lokacije">Lokacije</span></button>
        <nav class="setnja-izbornik" id="izbornik-lokacija" aria-label="Lokacije vanjske šetnje"></nav>

        <button class="smjer-gumb" id="lijevo" type="button"><span class="smjer-ikona">←</span><span class="smjer-tekst"></span></button>
        <button class="smjer-gumb" id="desno" type="button"><span class="smjer-tekst"></span><span class="smjer-ikona">→</span></button>
        <button class="smjer-gumb" id="gore" type="button"><span class="smjer-ikona">↑</span><span class="smjer-tekst"></span></button>
        <button class="smjer-gumb" id="dolje" type="button"><span class="smjer-ikona">↓</span><span class="smjer-tekst"></span></button>

        <p class="setnja-uputa" id="setnja-uputa">Odaberite strelicu ili povucite prstom za kretanje.</p>
    </main>

    <script src="setnja.js"></script>
</body>
</html>
