    <dialog class="galerija-pregled" aria-label="Pregled fotografije">
        <button class="galerija-zatvori" type="button" aria-label="Zatvori">×</button>
        <img src="" alt="">
    </dialog>

    <script src="language.js"></script>
    <script>
        const pregled = document.querySelector('.galerija-pregled');
        const velikaSlika = pregled.querySelector('img');

        document.querySelectorAll('.galerija-kategorija').forEach((gumb) => {
            gumb.setAttribute('aria-pressed', gumb.classList.contains('aktivna'));

            gumb.addEventListener('click', () => {
                const kategorija = gumb.dataset.galerija;

                document.querySelectorAll('.galerija-kategorija').forEach((stavka) => {
                    const aktivna = stavka === gumb;
                    stavka.classList.toggle('aktivna', aktivna);
                    stavka.setAttribute('aria-pressed', aktivna);
                });

                document.querySelectorAll('.galerija-panel').forEach((panel) => {
                    const aktivan = panel.dataset.panel === kategorija;
                    panel.classList.toggle('aktivan', aktivan);
                    panel.hidden = !aktivan;
                });
            });
        });

        document.querySelectorAll('.galerija-mreza button').forEach((gumb) => {
            gumb.addEventListener('click', () => {
                const slika = gumb.querySelector('img');
                velikaSlika.src = slika.src;
                velikaSlika.alt = slika.alt;
                pregled.showModal();
            });
        });

        pregled.querySelector('.galerija-zatvori').addEventListener('click', () => pregled.close());
        pregled.addEventListener('click', (dogadaj) => {
            if (dogadaj.target === pregled) pregled.close();
        });
    </script>
